services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: bushido-app:latest
    container_name: bushido-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - /opt/bushido/env/app.env
    depends_on:
      postgres:
        condition: service_healthy
      socket:
        condition: service_started
    networks:
      - bushido-net

    volumes:
      - /opt/bushido/logs:/app/logs

    environment:
      - LOG_FILE_PATH=/app/logs/app.log
      - ERROR_LOG_FILE_PATH=/app/logs/error.log

    command: [ "node", "server.js" ]

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s  # Next.js долго стартует впервые

  socket:
    build:
      context: /opt/bushido/socket
      dockerfile: Dockerfile.socket
    image: bushido-socket:latest
    container_name: bushido-socket
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - /opt/bushido/env/socket.env
    networks:
      - bushido-net

    command: [ "pnpm", "exec", "tsx", "server.ts" ]

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: bushido-db
    restart: unless-stopped
    env_file:
      - /opt/bushido/env/app.env
    volumes:
      - /var/lib/bushido-postgres:/var/lib/postgresql
      - ./sql/init-schema.sql:/docker-entrypoint-initdb.d/000_init_schema.sql:ro
    networks:
      - bushido-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  bushido-net:
    driver: bridge
