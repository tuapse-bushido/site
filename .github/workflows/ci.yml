name: CI Checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Уменьшил таймаут, так как билд должен быть быстрым

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests (CI mode)
        run: pnpm test:ci

      - name: Build Next.js project
        env:
          NEXT_TELEMETRY_DISABLED: 1
          JWT_SECRET: "ci-placeholder"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bushido"
        run: pnpm build

      # Вместо сборки всего compose, проверяем только Dockerfile
      # Это проверит корректность шагов сборки без привязки к путям на сервере
      - name: Validate Dockerfile
        run: docker build -t bushido-test .